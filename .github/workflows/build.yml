name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            openjdk-17-jdk-headless aapt apksigner zipalign dalvik-exchange android-sdk-platform-23

      - name: Build APK
        run: ./build.sh

      - name: Inspect APK
        run: aapt dump badging out/FireSettings.apk | grep -E "package|launchable|banner"

      # CI signs with a throwaway key, so this APK can't update the release build. Use it for testing only.
      - uses: actions/upload-artifact@v4
        with:
          name: FireSettings-ci-${{ matrix.arch }}
          path: out/FireSettings.apk
          retention-days: 14
